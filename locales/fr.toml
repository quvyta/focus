[cli]
usage = """qfocus                ouvre l’interface
qfocus start FOCUS    lance un compteur et sort ; FOCUS : nom ou catégorie/focus
qfocus stop           arrête le compteur en cours et l’enregistre
qfocus status         une ligne : le focus en cours et son temps jusqu’ici
qfocus today          une ligne : le total du jour
  --switch            avec start : arrête d’abord ce qui tourne
  --json              affiche un objet JSON au lieu du texte
  -h, --help          ce texte
  -V, --version       affiche la version
codes de sortie : 0 fait · 1 introuvable · 2 une fenêtre ouverte écrit
                  3 déjà en cours · 4 rien en cours"""
