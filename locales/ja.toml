[cli]
usage = """qfocus                画面を開く
qfocus start FOCUS    計測を始めて終了。FOCUS は名前か カテゴリ/フォーカス
qfocus stop           実行中のカウンターを止めて記録する
qfocus status         1 行で：実行中のフォーカスと経過時間
qfocus today          1 行で：今日の合計
  --switch            start と一緒に：先に実行中のものを止める
  --json              テキストの代わりに JSON オブジェクトを 1 つ出力
  -h, --help          このテキスト
  -V, --version       バージョンを表示
終了コード：0 完了 · 1 見つからない · 2 開いている画面が書き込み中
            3 すでに実行中 · 4 実行中のものがない"""
no-data-dir = "このシステムにはデータフォルダがないため、コマンドラインからは記録できません。"
