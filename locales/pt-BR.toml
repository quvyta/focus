[cli]
usage = """qfocus                abre a interface
qfocus start FOCO     inicia um contador e sai; FOCO: um nome ou categoria/foco
qfocus stop           para o contador em andamento e o registra
qfocus status         uma linha: o foco em andamento e seu tempo até agora
qfocus today          uma linha: o total de hoje
  --switch            com start: primeiro para o que estiver rodando
  --json              imprime um objeto JSON em vez de texto
  -h, --help          este texto
códigos de saída: 0 feito · 1 não encontrado · 2 uma janela aberta está gravando
                  3 já rodando · 4 nada rodando"""
