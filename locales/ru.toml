[cli]
usage = """qfocus                открыть интерфейс
qfocus start FOCUS    запустить счётчик и выйти; FOCUS: имя или категория/фокус
qfocus stop           остановить идущий счётчик и записать его
qfocus status         одна строка: идущий фокус и его время
qfocus today          одна строка: итог за сегодня
  --switch            со start: сначала остановить идущий
  --json              вывести один объект JSON вместо текста
  -h, --help          этот текст
коды выхода: 0 готово · 1 не найдено · 2 пишет открытое окно
             3 уже идёт · 4 ничего не идёт"""
no-data-dir = "В системе нет папки для данных; из командной строки ничего не записать."
unknown-command = "Неизвестная команда: {name}"
missing-name = "Для start нужно имя фокуса."
not-found = "Фокуса {name} нет."
ambiguous = "{name} подходит к нескольким фокусам; уточните какой:"
locked = "Пишет открытое окно qfocus; закройте его или работайте в нём."
already-running = "{focus} уже идёт {duration}; --switch остановит его и запустит {name}."
started = "{focus}: начато."
stopped = "{focus} · {duration}"
nothing-running = "Ничего не идёт."
record-failed = "Не удалось записать сессию: {error}. Счётчик сохранён в {path}."
running-broken = "Не удалось прочитать {path}; счётчик оставлен как есть."
status = "{focus} · {duration}"
status-paused = "{focus} · {duration} · перерыв"
status-cut-restart = "{focus} · {duration} · после {time} не считалось: компьютер перезагрузился"
status-cut-window = "{focus} · {duration} · после {time} не считалось: окно закрылось"
today = "{duration}"
unknown-focus = "неизвестный фокус"
