[cli]
usage = """qfocus                打开界面
qfocus start FOCUS    开始计时并退出；FOCUS：名称或 分类/专注项
qfocus stop           停止运行中的计时器并记录
qfocus status         一行：运行中的专注项及已计时间
qfocus today          一行：今天的合计
  --switch            与 start 一起用：先停止正在运行的
  --json              输出一个 JSON 对象而非文本
  -h, --help          本说明
  -V, --version       显示版本
退出码：0 完成 · 1 未找到 · 2 有打开的窗口在写入
        3 已在运行 · 4 没有在运行"""
