[cli]
usage = """qfocus                open the interface
qfocus start FOCUS    start a counter and exit; FOCUS is a name or category/focus
qfocus stop           stop the running counter and record it
qfocus status         one line: the running focus and its time so far
qfocus today          one line: today's total
  --switch            with start: stop whatever is running first
  --json              print one JSON object instead of text
  -h, --help          this text
exit codes: 0 done · 1 not found · 2 an open window is writing · 3 already running · 4 nothing running"""
no-data-dir = "There is no data folder on this system; nothing can be recorded from the command line."
unknown-command = "Unknown command: {name}"
missing-name = "start needs a focus name."
not-found = "No focus is called {name}."
ambiguous = "{name} matches more than one focus; say which one:"
locked = "An open qfocus window is writing; close it or use that window."
already-running = "{focus} is already running for {duration}; --switch stops it and starts {name}."
started = "Started {focus}."
stopped = "{focus} · {duration}"
nothing-running = "Nothing is running."
record-failed = "The session could not be recorded: {error}. The counter is kept in {path}."
running-broken = "{path} cannot be read; the counter is left as it is."
status = "{focus} · {duration}"
status-paused = "{focus} · {duration} · on a break"
status-cut-restart = "{focus} · {duration} · nothing counted after {time}: the computer restarted"
status-cut-window = "{focus} · {duration} · nothing counted after {time}: the window closed"
today = "{duration}"
unknown-focus = "unknown focus"
