[cli]
usage = """qfocus                abre la interfaz
qfocus start FOCO     inicia un contador y sale; FOCO: nombre o categoría/foco
qfocus stop           para el contador en marcha y lo registra
qfocus status         una línea: el foco en marcha y su tiempo hasta ahora
qfocus today          una línea: el total de hoy
  --switch            con start: primero para lo que esté en marcha
  --json              imprime un objeto JSON en vez de texto
  -h, --help          este texto
  -V, --version       muestra la versión
códigos de salida: 0 hecho · 1 no encontrado · 2 una ventana abierta escribe
                   3 ya en marcha · 4 nada en marcha"""
