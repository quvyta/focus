[cli]
usage = """qfocus                arayüzü açar
qfocus start ODAK     sayacı başlatır ve çıkar; ODAK bir ad ya da kategori/odak
qfocus stop           çalışan sayacı durdurur ve kaydeder
qfocus status         tek satır: çalışan odak ve şimdiye kadarki süresi
qfocus today          tek satır: bugünün toplamı
  --switch            start ile: önce çalışanı durdurur
  --json              metin yerine tek bir JSON nesnesi basar
  -h, --help          bu metin
  -V, --version       sürümü yazar
çıkış kodları: 0 tamam · 1 bulunamadı · 2 açık bir pencere yazıyor
               3 zaten çalışıyor · 4 çalışan yok"""
