[cli]
usage = """qfocus                öffnet die Oberfläche
qfocus start FOKUS    startet Zähler und endet; FOKUS: Name oder Kategorie/Fokus
qfocus stop           stoppt den laufenden Zähler und erfasst ihn
qfocus status         eine Zeile: laufender Fokus und seine bisherige Zeit
qfocus today          eine Zeile: die Summe von heute
  --switch            mit start: stoppt zuerst, was gerade läuft
  --json              gibt ein JSON-Objekt statt Text aus
  -h, --help          dieser Text
Exit-Codes: 0 fertig · 1 nicht gefunden · 2 ein offenes Fenster schreibt
            3 läuft schon · 4 nichts läuft"""
