[package]
name = "quvyta-focus"
description = "Focus tracking in the terminal: timers, records and charts (beta)"
repository = "https://github.com/quvyta/focus"
homepage = "https://quvyta.com/qfocus/"
readme = "README.md"
keywords = ["tui", "terminal", "focus", "time-tracking", "productivity"]
categories = ["command-line-utilities"]
version = "0.1.15"
edition = "2024"
rust-version = "1.95"
license = "MIT"
# Only what the program is built from goes into the package; the rest of the repository is for
# working on it. Every entry starts at the root: without the leading slash cargo matches the name
# at any depth, so a file of the same name in a subfolder would slip into the package.
include = [
    "/src/**",
    "/locales/**",
    "/keymap.toml",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[lib]
name = "qfocus"
path = "src/lib.rs"

[dependencies]
quvyta-framework = { version = "0.1.29", features = ["updates"] }
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "display", "preserve_order"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
cast_lossless = "deny"
needless_pass_by_value = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
uninlined_format_args = "deny"

