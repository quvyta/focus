name: Translation
description: A word or sentence that reads wrong in your language, or a language you would like to add.
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: Thank you. Nothing needs to be built for this; CONTRIBUTING.md explains how the language files work, if you want to change one yourself.
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Deutsch
        - Español
        - Français
        - Português (Brasil)
        - Русский
        - 日本語
        - 简体中文
        - Türkçe
        - English
        - A new language (name it below)
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: The text as it is now
      description: Copy it from the screen. If you know the key in the language file (such as `app.cancelled`), add it.
    validations:
      required: true
  - type: textarea
    id: better
    attributes:
      label: The wording you would use
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why, if you like
      description: For example, the word other time trackers or your system use for the same thing. It helps us keep the rest of the file consistent.
